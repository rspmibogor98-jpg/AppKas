  border-bottom: none;
}

/* Baris selang-seling tetap terbaca: putih / #F9FAFB */

table tbody tr:nth-child(even) td {
  background-color: #f9fafb;
}

table tbody tr:nth-child(odd) td {
  background-color: #ffffff;
}

/* Peran kolom — dipakai lewat data-col pada th/td */

table th[data-col="date"],
table td[data-col="date"],
table th[data-col="status"],
table td[data-col="status"],
table th[data-col="center"],
table td[data-col="center"] {
  text-align: center !important;
}

table th[data-col="left"],
table td[data-col="left"] {
  text-align: left !important;
}

table th[data-col="right"],
table td[data-col="right"] {
  text-align: right !important;
}

table td[data-col="name"] {
  font-size: 14px !important;
  font-weight: 600 !important;
  color: #111827 !important;
}

table td[data-col="amount"],
table th[data-col="amount"] {
  font-size: 14px !important;
  font-weight: 700 !important;
  font-variant-numeric: tabular-nums !important;
  text-align: right !important;
  color: #111827 !important;
}

table td[data-col="date"] {
  font-size: 13px !important;
  color: #374151 !important;
  white-space: nowrap;
}

table td[data-col="desc"] {
  font-size: 14px !important;
  color: #111827 !important;
  white-space: nowrap !important;
  overflow: hidden;
  text-overflow: ellipsis;
}

table td[data-col="desc"] > p {
  display: block !important;
  -webkit-line-clamp: unset !important;
  -webkit-box-orient: unset !important;
  white-space: nowrap !important;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Lebar minimum per kolom — tabel scroll ke samping, kolom tidak mengecil / wrap */

table th[data-col="center"],
table td[data-col="center"] {
  min-width: 40px;
}

table th[data-col="left"],
table td[data-col="left"] {
  min-width: 140px;
}

table th[data-col="name"],
table td[data-col="name"] {
  min-width: 140px;
  max-width: 210px;
}

table th[data-col="amount"],
table td[data-col="amount"] {
  min-width: 120px;
}

table th[data-col="date"],
table td[data-col="date"] {
  min-width: 120px;
}

table th[data-col="status"],
table td[data-col="status"] {
  min-width: 110px;
}

table th[data-col="action"],
table td[data-col="action"] {
  min-width: 120px;
  text-align: center !important;
}

table th[data-col="desc"],
table td[data-col="desc"] {
  min-width: 160px;
  max-width: 260px;
}

/* Badge status di dalam tabel */

table td[data-col="status"] span {
  font-size: 12px !important;
  font-weight: 700 !important;
  line-height: 1.4;
  padding: 4px 8px !important;
  border-radius: 9999px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}

/* Angka tabular untuk total di dalam tabel */

table td.amount-positive {
  color: #065f46 !important;
  font-weight: 700 !important;
  font-variant-numeric: tabular-nums;
}

table td.amount-negative {
  color: #991b1b !important;
  font-weight: 700 !important;
  font-variant-numeric: tabular-nums;
}

/* Tombol & input yang konsisten — ukuran baca 14px */

button {
  font-size: 14px;
  line-height: 1.45;
}

input:not([type="checkbox"]):not([type="radio"]),
select, textarea {
  font-size: 14px !important;
  line-height: 1.5;
  padding: 10px 12px !important;
  color: #111827;
}

input:not([type="checkbox"]):not([type="radio"])::-moz-placeholder, textarea::-moz-placeholder {
  color: #6b7280;
}

input:not([type="checkbox"]):not([type="radio"])::placeholder,
textarea::placeholder {
  color: #6b7280;
}

/* Tombol kecil ikon / aksi tabel tetap ringkas tapi tidak di bawah 12px */

.table-action-btn {
  font-size: 12px !important;
  line-height: 1.4;
}

.focus\:border-emerald-700:focus{
  --tw-border-opacity: 1;
  border-color: rgb(4 120 87 / var(--tw-border-opacity, 1));
}

.disabled\:opacity-60:disabled{
  opacity: 0.6;
}

@media (min-width: 640px){
  .sm\:place-items-center{
    place-items: center;
  }

  .sm\:p-4{
    padding: 1rem;
  }

  .sm\:p-7{
    padding: 1.75rem;
  }
}
