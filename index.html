        var close = top.querySelector('button[aria-label="Tutup"]');
        var target = close || focusable(top)[0] || top;
        if (target && typeof target.focus === "function") {
          target.focus({ preventScroll: true });
        }
      });
    }
  }

  document.addEventListener("keydown", function (event) {
    var list = overlays();
    if (!list.length) return;
    var top = list[list.length - 1];

    if (event.key === "Escape") {
      var close =
        top.querySelector('button[aria-label="Tutup"]') ||
        Array.prototype.slice
          .call(top.querySelectorAll("button"))
          .filter(function (button) {
            return /^(Batal|Tutup|Kembali|Tutup Pratinjau)$/i.test(
              (button.textContent || "").trim(),
            );
          })[0];
      if (close) {
        event.preventDefault();
        close.click();
      }
      return;
    }

    if (event.key !== "Tab") return;

    var items = focusable(top);
    if (!items.length) {
      event.preventDefault();
      top.focus({ preventScroll: true });
      return;
    }

    var first = items[0];
    var last = items[items.length - 1];

    if (!top.contains(document.activeElement)) {
      event.preventDefault();
      first.focus({ preventScroll: true });
      return;
    }

    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus({ preventScroll: true });
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus({ preventScroll: true });
    }
  });

  var observer = new MutationObserver(sync);
  observer.observe(document.body, { childList: true, subtree: true });

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", sync, { once: true });
  } else {
    sync();
  }

  window.addEventListener("load", sync);
})();

</script>

<!-- TONG SAMPAH: hapus = pindah ke Sampah, bisa dipulihkan. Di luar React, tidak mengubah logika app. -->
<script>
(function(){
  function cfg(){try{var s=window.localStorage&&window.localStorage.getItem("firebase_config_json");if(s){var c=JSON.parse(s);if(c&&c.apiKey&&c.projectId)return c}}catch(e){}return (window.__FIREBASE_CONFIG_RUNTIME&&window.__FIREBASE_CONFIG_RUNTIME.apiKey)?window.__FIREBASE_CONFIG_RUNTIME:null}
  async function db(){
    if(typeof window.firebase==="undefined"||!window.firebase.firestore)throw Error("Firebase belum termuat. Refresh dulu (Ctrl+R).");
    var c=cfg(); if(!c) throw Error("Config Firebase belum disimpan.");
    var app=(window.firebase.apps&&window.firebase.apps.length)?window.firebase.app():window.firebase.initializeApp(c);
    return window.firebase.firestore(app);
  }
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
  function labelOf(it){var v=it.value||{};return it.label||v.name||v.description||v.key||it.originalId||"Data"}
  function descOf(it){var v=it.value||{};var parts=[];if(v.amount!=null)parts.push("Rp "+Number(v.amount).toLocaleString("id-ID"));if(v.date)parts.push(v.date);if(v.monthKey)parts.push("Bulan "+v.monthKey);if(v.type)parts.push(v.type==="in"?"Masuk":"Keluar");if(v.category)parts.push(v.category);return parts.join(" • ")}
  function whenOf(it){try{return new Date(it.deletedAt).toLocaleString("id-ID")}catch(e){return it.deletedAt||""}}
  async function load(){
    var d=await db(); var snap=await d.collection("trash").get();
    var items=snap.docs.map(function(doc){return {id:doc.id, data:doc.data()}}).sort(function(a,b){return String(b.data.deletedAt||"").localeCompare(String(a.data.deletedAt||""))});
    return {d:d, items:items};
  }
  async function render(){if(!isAdmin()){document.getElementById("trash-list").innerHTML='<p style="padding:16px;color:#991B1B">Menu Sampah hanya untuk Admin.</p>';return}
    var list=document.getElementById("trash-list"); var count=document.getElementById("trash-count");
    list.innerHTML='<p style="padding:16px;color:#374151">Memuat Sampah...</p>';
    try{
      var r=await load(); count.textContent=r.items.length?(" ("+r.items.length+")"):"";
      if(!r.items.length){list.innerHTML='<p style="padding:16px;color:#374151">Sampah kosong. Data yang lo hapus mulai sekarang akan muncul di sini dan bisa dipulihkan.</p>';return}
      list.innerHTML=r.items.map(function(w){var it=w.data;return '<div style="display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border:1px solid #E5E7EB;border-radius:14px;padding:12px;margin:8px 0;background:#fff">'
        +'<div style="min-width:0"><div style="font-weight:800;color:#111827">'+esc(labelOf(it))+'</div>'
        +'<div style="font-size:12px;color:#6B7280">'+esc(it.originalCollection||"")+' • dihapus '+esc(whenOf(it))+'</div>'
        +'<div style="font-size:13px;color:#374151;margin-top:2px">'+esc(descOf(it))+'</div></div>'
        +'<div style="display:flex;gap:6px;flex-shrink:0"><button data-restore="'+w.id+'" style="background:#047857;color:#fff;border:0;border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer">Pulihkan</button>'
        +'<button data-del="'+w.id+'" style="background:#FEE2E2;color:#991B1B;border:0;border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer">Hapus Permanen</button></div></div>'}).join("");
      list.querySelectorAll("[data-restore]").forEach(function(b){b.onclick=async function(){b.disabled=true;b.textContent="Memulihkan...";try{var d=await db();var doc=await d.collection("trash").doc(b.getAttribute("data-restore")).get();if(!doc.exists)throw Error("Item Sampah sudah tidak ada.");var it=doc.data();await d.collection(it.originalCollection).doc(it.originalId).set(it.value||{});await d.collection("trash").doc(doc.id).delete();window.dispatchEvent(new CustomEvent("kas-trash-restored"));document.getElementById("trash-modal").style.display="none";var ok=document.createElement("div");ok.textContent="✅ Dipulihkan — saldo langsung diperbarui.";ok.style.cssText="position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:10001;background:#047857;color:#fff;padding:12px 18px;border-radius:999px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.3)";document.body.appendChild(ok);setTimeout(function(){ok.remove()},2500);}catch(e){alert("Gagal memulihkan: "+(e&&e.message||e));b.disabled=false;b.textContent="Pulihkan"}}});
      list.querySelectorAll("[data-del]").forEach(function(b){b.onclick=async function(){if(!confirm("Hapus permanen? Data ini TIDAK BISA dipulihkan lagi."))return;try{var d=await db();await d.collection("trash").doc(b.getAttribute("data-del")).delete();render()}catch(e){alert("Gagal: "+(e&&e.message||e))}}});
    }catch(e){list.innerHTML='<p style="padding:16px;color:#991B1B">Gagal memuat Sampah: '+esc(e&&e.message||e)+'</p>'}
  }
  function isAdmin(){return window.__KAS_ROLE==="admin"}
  function syncFab(){var f=document.getElementById("trash-fab");if(f)f.style.display=isAdmin()?"block":"none"}
  function open(){if(!isAdmin()){alert("Menu Sampah hanya untuk Admin.");return}document.getElementById("trash-modal").style.display="grid";render()}
  window.addEventListener("kas-role-changed", syncFab);
  window.addEventListener("kas-trash-open", open);
  function close(){document.getElementById("trash-modal").style.display="none"}
  var btn=document.createElement("button");
  btn.id="trash-fab"; btn.textContent="🗑️ Sampah";
  btn.style.cssText="position:fixed;right:16px;bottom:16px;z-index:9999;display:none;background:#111827;color:#fff;border:0;border-radius:999px;padding:12px 18px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.35);cursor:pointer";
  btn.onclick=open; document.body.appendChild(btn);
  var modal=document.createElement("div");
  modal.id="trash-modal"; modal.style.cssText="display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.5);place-items:center;padding:16px";
  modal.innerHTML='<div style="background:#F9FAFB;border-radius:20px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:18px">'
    +'<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:18px">🗑️ Tong Sampah<span id="trash-count"></span></h2>'
    +'<button id="trash-close" style="background:#E5E7EB;border:0;border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer">Tutup</button></div>'
    +'<p style="font-size:13px;color:#374151">Data yang terhapus masuk ke sini dulu. Tekan <b>Pulihkan</b> — data balik dan saldo langsung berubah, tanpa balik ke halaman login. <b>Hapus Permanen</b> = hilang selamanya, tidak bisa dibalikin.</p>'
    +'<div style="display:flex;gap:8px"><button id="trash-empty" style="background:#FEE2E2;color:#991B1B;border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer">Kosongkan Sampah</button>'
    +'<button id="trash-refresh" style="background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer">Refresh</button></div>'
    +'<div id="trash-list"></div></div>';
  document.body.appendChild(modal);
  document.getElementById("trash-close").onclick=close;
  document.getElementById("trash-refresh").onclick=render;
  document.getElementById("trash-empty").onclick=async function(){if(!confirm("Kosongkan semua Sampah? Semua item akan hilang permanen dan TIDAK BISA dipulihkan."))return;try{var r=await load();for(var i=0;i<r.items.length;i++){await r.d.collection("trash").doc(r.items[i].id).delete()}render()}catch(e){alert("Gagal: "+(e&&e.message||e))}};
  modal.addEventListener("click",function(e){if(e.target===modal)close()});
})();
</script>

<style id="trash-placement">
@media (max-width: 640px){ #trash-fab{display:none !important} }
@media (min-width: 641px){ .trash-header-wrap{display:none !important} }
</style>

<!-- LOGIN ADMIN FIREBASE AUTH: Admin wajib login email+password Firebase. UID pertama yang login jadi kunci Admin. -->
<script>
(function(){
  function adminUid(){try{return window.localStorage&&window.localStorage.getItem("kas_admin_uid")||""}catch(e){return ""}}
  function setAdminUid(u){try{window.localStorage&&window.localStorage.setItem("kas_admin_uid",u)}catch(e){} window.__KAS_ADMIN_UID=u}
  window.__KAS_ADMIN_UID = adminUid();
  window.__KAS_AUTH_UID = null;
  function ensureAuth(){
    if(typeof window.firebase==="undefined"||!window.firebase.auth)throw Error("Script Firebase Auth gagal dimuat. Refresh (Ctrl+R).");
    var cfg=null; try{var s=window.localStorage&&window.localStorage.getItem("firebase_config_json"); if(s){var c=JSON.parse(s); if(c&&c.apiKey&&c.projectId)cfg=c}}catch(e){}
    if(!cfg&&(window.__FIREBASE_CONFIG_RUNTIME&&window.__FIREBASE_CONFIG_RUNTIME.apiKey))cfg=window.__FIREBASE_CONFIG_RUNTIME;
    if(!cfg)throw Error("Config Firebase belum disimpan.");
    var app=(window.firebase.apps&&window.firebase.apps.length)?window.firebase.app():window.firebase.initializeApp(cfg);
    return window.firebase.auth(app);
  }
  window.__kasAdminLogin=function(){
    return new Promise(function(resolve,reject){
      var auth; try{auth=ensureAuth()}catch(e){reject(e);return}
      var old=document.getElementById("admin-auth-modal"); if(old)old.remove();
      var m=document.createElement("div");
      m.id="admin-auth-modal";
      m.style.cssText="position:fixed;inset:0;z-index:10002;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px";
      m.innerHTML='<div style="background:#fff;border-radius:20px;max-width:420px;width:100%;padding:20px">'
        +'<h2 style="margin:0;font-size:18px">🔐 Login Admin Firebase</h2>'
        +'<p style="font-size:13px;color:#374151">Admin wajib login pakai akun Firebase (email + password), bukan cuma PIN. Akun dibuat di Firebase Console → Authentication.</p>'
        +'<label style="font-size:13px;font-weight:800">Email Admin</label>'
        +'<input id="admin-auth-email" type="email" placeholder="admin@email.com" style="width:100%;box-sizing:border-box;margin:6px 0 12px;padding:11px;border:1px solid #E5E7EB;border-radius:12px" />'
        +'<label style="font-size:13px;font-weight:800">Password</label>'
        +'<input id="admin-auth-pass" type="password" placeholder="Password Firebase" style="width:100%;box-sizing:border-box;margin:6px 0 4px;padding:11px;border:1px solid #E5E7EB;border-radius:12px" />'
        +'<p id="admin-auth-err" style="font-size:13px;color:#991B1B;font-weight:700;min-height:18px"></p>'
        +'<p id="admin-auth-uid" style="font-size:12px;color:#065F46;font-weight:700"></p>'
        +'<div style="display:flex;gap:8px;margin-top:8px"><button id="admin-auth-go" style="flex:1;background:#047857;color:#fff;border:0;border-radius:12px;padding:12px;font-weight:800;cursor:pointer">Login</button>'
        +'<button id="admin-auth-cancel" style="background:#E5E7EB;border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer">Batal</button></div>'
        +'<p style="font-size:12px;color:#6B7280">UID Admin yang tersimpan: '+(adminUid()||"(belum ada — login pertama akan menyimpan UID lo sebagai Admin)")+'</p></div>';
      document.body.appendChild(m);
      var emailEl=document.getElementById("admin-auth-email"), passEl=document.getElementById("admin-auth-pass");
      document.getElementById("admin-auth-cancel").onclick=function(){m.remove();reject(new Error("Login Admin dibatalkan"))};
      document.getElementById("admin-auth-go").onclick=async function(){
        var btn=document.getElementById("admin-auth-go"); btn.disabled=true; btn.textContent="Memverifikasi...";
        var errEl=document.getElementById("admin-auth-err"); errEl.textContent="";
        try{
          var email=(emailEl.value||"").trim(), pass=passEl.value||"";
          if(!email||!pass)throw Error("Email dan password wajib diisi.");
          var cred=await auth.signInWithEmailAndPassword(email,pass);
          var uid=cred.user&&cred.user.uid||"";
          if(!uid)throw Error("Gagal mendapatkan UID.");
          var saved=adminUid();
          if(saved&&saved!==uid){await auth.signOut();throw Error("Akun ini bukan Admin. UID-nya tidak cocok dengan UID Admin yang tersimpan.")}
          if(!saved){setAdminUid(uid);document.getElementById("admin-auth-uid").textContent="✅ UID Admin tersimpan: "+uid+" — salin UID ini ke Firestore Rules."}
          window.__KAS_AUTH_UID=uid; window.__KAS_ADMIN_UID=uid;
          m.remove(); resolve(uid);
        }catch(e){
          var msg=(e&&e.message||"Login gagal");
          if(e&&e.code==="auth/invalid-credential")msg="Email / password salah.";
          if(e&&e.code==="auth/user-not-found")msg="Email Admin belum terdaftar di Firebase Authentication.";
          if(e&&e.code==="auth/wrong-password")msg="Password salah.";
          if(e&&e.code==="auth/invalid-email")msg="Format email tidak valid.";
          if(e&&e.code==="auth/user-disabled")msg="Akun Admin ini dinonaktifkan.";
          if(e&&e.code==="auth/operation-not-allowed")msg="Email/Password belum diaktifkan di Firebase Console → Authentication → Sign-in method.";
          errEl.textContent=msg; btn.disabled=false; btn.textContent="Login";
        }
      };
      passEl.addEventListener("keydown",function(e){if(e.key==="Enter")document.getElementById("admin-auth-go").click()});
      setTimeout(function(){emailEl.focus()},50);
    });
  };
  // Kalau halaman di-refresh saat Admin masih login Firebase, pulihkan UID-nya
  try{var a0=ensureAuth(); a0.onAuthStateChanged(function(u){ if(u){window.__KAS_AUTH_UID=u.uid; if(!adminUid()){setAdminUid(u.uid)}} else {window.__KAS_AUTH_UID=null} })}catch(e){}
})();
</script>
